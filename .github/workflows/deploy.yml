# Deploy on push.
#
# Render only rebuilds when it is told to, and this repository is not what tells it:
# a push changes the code here while the running service keeps serving the old build.
# This workflow calls Render.
#
# Look at the service's Settings tab first. If Auto-Deploy says "On Commit", Render is
# watching this repository and deploys by itself, so none of this is needed.
#
# Otherwise it uses whichever credential is set:
#
#   RENDER_API_KEY + RENDER_SERVICE_ID    preferred
#     Render's REST API. You create the key, and you can delete it, under Account
#     Settings > API Keys, so a key that leaks can be replaced. The request also names
#     the commit to build, so Render builds the commit this run tested rather than
#     whatever the branch tip has become by then.
#
#   RENDER_DEPLOY_HOOK
#     The service's secret URL, from Settings > Deploy Hook. Render's docs mention a
#     "Regenerate Hook" button, but not every dashboard shows one, so assume you
#     cannot rotate it. A leaked hook can only rebuild commits that are already in
#     this repository: no code injection, no environment variables, no database
#     access. The worst case is a wasted build. The README has the setup steps.
#
# Adding the API key while the hook secret is still set is safe. The API path is used
# as soon as both API values exist, so the hook can be deleted afterwards.
#
# With no credential set the run succeeds and says so, because a missing secret
# should not fail a push. Secrets are passed as environment variables rather than on
# the command line, and `set -x` is deliberately not used, so they cannot reach the
# log.
name: deploy

on:
  push:
    branches: [main]
  # "Run workflow" in the Actions tab rehearses a new credential: it deploys whatever
  # main points at now, with no push, so a wrong key fails here instead of on the next
  # push.
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy this commit
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$API_KEY" ] && [ -n "$SERVICE_ID" ]; then
            echo "Asking Render's API to deploy ${SHA} (service ${SERVICE_ID})."
            CODE=$(curl -sS -o deploy-response.json -w '%{http_code}' \
              -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${API_KEY}" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -d "{\"commitId\":\"${SHA}\",\"clearCache\":\"do_not_clear\"}") || CODE=000
            echo "Render answered HTTP ${CODE}."
            case "$CODE" in
              201|202)
                echo "Build queued for ${SHA}. It runs in the background; check it with:"
                echo "  npm run check:deployed -- <service URL>"
                ;;
              401)
                echo "::error::Render rejected the API key (HTTP 401), so it may have been revoked. Create a new key under Account Settings > API Keys and update the RENDER_API_KEY secret."
                exit 1
                ;;
              *)
                echo "::error::Render refused the deploy (HTTP ${CODE})."
                cat deploy-response.json 2>/dev/null || true
                exit 1
                ;;
            esac
          elif [ -n "$HOOK" ]; then
            echo "No API key is set, so using the deploy hook. It builds the latest"
            echo "commit on the connected branch."
            if curl -fsS -X POST "$HOOK"; then
              echo ""
              echo "Build requested. It runs in the background; check it with:"
              echo "  npm run check:deployed -- <service URL>"
            else
              RC=$?
              echo "::error::The deploy hook refused the request (curl exit ${RC}). If the hook was regenerated then this secret is stale: copy the new URL from the service's Settings > Deploy Hook. A 404 can also mean the commit is not in the linked repository."
              exit 1
            fi
          else
            echo "No deploy credential is set, so there is nothing to call."
            echo "Either create an API key under Account Settings > API Keys, take the"
            echo "service's srv-... ID from its dashboard URL, and add both here under"
            echo "Settings > Secrets and variables > Actions as RENDER_API_KEY and"
            echo "RENDER_SERVICE_ID,"
            echo "or copy the URL from the service's Settings > Deploy Hook and add it"
            echo "here as RENDER_DEPLOY_HOOK."
            echo "If the service's Settings show Auto-Deploy as On Commit, Render deploys"
            echo "by itself and none of this is needed."
            exit 0
          fi
