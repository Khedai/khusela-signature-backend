<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khusela Secure Signing</title><style>body{font-family:Arial,sans-serif;background:#f5f7f7;margin:0;color:#17352f}.wrap{max-width:720px;margin:30px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 5px 25px #0001}h1{color:#1f6b5a}canvas{width:100%;height:220px;border:2px solid #aaa;border-radius:8px;touch-action:none}.row{margin:16px 0}button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer}.primary{background:#1f6b5a;color:white}.secondary{background:#ddd}.status{font-weight:bold;margin-top:15px}</style></head><body><div class="wrap"><h1>Khusela Secure Digital Signature</h1><p id="intro">Loading your secure signing session…</p><div id="form" hidden><div class="row"><strong>Client:</strong> <span id="name"></span></div><div class="row" id="signerRow" hidden><strong>Signing as:</strong> <span id="signer"></span></div><div class="row"><label>ID document <input type="file" id="id" accept="application/pdf,image/jpeg,image/png"></label></div><div class="row"><label>Payslip <input type="file" id="payslip" accept="application/pdf,image/jpeg,image/png"></label></div><div class="row"><label>Bank statement 1 <input type="file" id="bank1" accept="application/pdf,image/jpeg,image/png"></label></div><div class="row"><label>Bank statement 2 <input type="file" id="bank2" accept="application/pdf,image/jpeg,image/png"></label></div><div class="row"><label>Bank statement 3 <input type="file" id="bank3" accept="application/pdf,image/jpeg,image/png"></label></div><h3>Sign once below</h3><canvas id="sig"></canvas><div class="row"><button class="secondary" id="clear">Clear Signature</button> <button class="primary" id="submit">Submit Signature</button></div><div class="status" id="status"></div></div></div><script src="/sign.js"></script></body></html>
