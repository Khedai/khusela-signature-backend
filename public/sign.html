<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khusela Secure Signing</title><style>body{font-family:Arial,sans-serif;background:#f5f7f7;margin:0;color:#17352f}.wrap{max-width:720px;margin:30px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 5px 25px #0001}h1{color:#1f6b5a}canvas{width:100%;height:220px;border:2px solid #aaa;border-radius:8px;touch-action:none}.row{margin:16px 0}button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer}.primary{background:#1f6b5a;color:white}.secondary{background:#ddd}.status{font-weight:bold;margin-top:15px}</style></head><body><div class="wrap"><h1>Khusela Secure Digital Signature</h1><p id="intro">Loading your secure signing session…</p><div id="form" hidden><div class="row"><strong>Client:</strong> <span id="name"></span></div><div class="row" id="signerRow" hidden><strong>Signing as:</strong> <span id="signer"></span></div><div class="row"><label>ID document <input type="file" id="id" accept="application/pdf,image/jpeg,image/png"></label></div><div class="row"><label>Payslip <input type="file" id="payslip" accept="application/pdf,image/jpeg,image/png"></label></div><div class="row"><label>Bank statement 1 <input type="file" id="bank1" accept="application/pdf,image/jpeg,image/png"></label></div><div class="row"><label>Bank statement 2 <input type="file" id="bank2" accept="application/pdf,image/jpeg,image/png"></label></div><div class="row"><label>Bank statement 3 <input type="file" id="bank3" accept="application/pdf,image/jpeg,image/png"></label></div><h3>Sign once below</h3><canvas id="sig"></canvas><div class="row"><button class="secondary" id="clear">Clear Signature</button> <button class="primary" id="submit">Submit Signature</button></div><div class="status" id="status"></div></div></div><script>const token=location.pathname.split('/').filter(Boolean).pop();const $=id=>document.getElementById(id);let drawing=false,ctx=$('sig').getContext('2d');function size(){const c=$('sig'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=2;ctx.lineCap='round'}size();window.addEventListener('resize',size);function p(e){const r=$('sig').getBoundingClientRect();return{x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,y:(e.touches?e.touches[0].clientY:e.clientY)-r.top}}$('sig').addEventListener('pointerdown',e=>{drawing=true;const q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)});$('sig').addEventListener('pointermove',e=>{if(!drawing)return;const q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke()});['pointerup','pointerleave'].forEach(x=>$('sig').addEventListener(x,()=>drawing=false));$('clear').onclick=()=>{ctx.clearRect(0,0,$('sig').width,$('sig').height)};async function load(){const r=await fetch('/api/sign/'+token);const d=await r.json();if(!r.ok){$('intro').textContent=d.error||'This signing link is not available.';return}$('name').textContent=d.clientName;$('intro').textContent=(d.requireDocuments?'Please upload the requested documents and sign once below.':'Please sign once below.')+' This secure link expires on '+new Date(d.expiresAt).toLocaleString()+'.';$('signer').textContent=d.signerLabel||'';$('signerRow').hidden=!d.signerLabel;if(!d.requireDocuments){var rows=document.querySelectorAll('#form .row label');for(var i=0;i<rows.length;i++){var r=rows[i].closest('.row');if(r)r.hidden=true}}$('form').hidden=false}load();$('submit').onclick=async()=>{try{$('status').textContent='Uploading documents…';const fd=new FormData();[['id','ID document'],['payslip','Payslip'],['bank1','Bank statement 1'],['bank2','Bank statement 2'],['bank3','Bank statement 3']].forEach(([x,k])=>{if($(x).files[0])fd.append('documents',$(x).files[0]);});let r=await fetch('/api/sign/'+token+'/upload',{method:'POST',body:fd});let d=await r.json();if(!r.ok)throw Error(d.error);$('status').textContent='Recording signature…';r=await fetch('/api/sign/'+token+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signature:$('sig').toDataURL('image/png')})});d=await r.json();if(!r.ok)throw Error(d.error);$('status').textContent=d.message;$('submit').disabled=true}catch(e){$('status').textContent=e.message}}</script></body></html>
