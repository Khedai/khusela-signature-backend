# Render Blueprint for the Khusela signature backend.
#
# In the Render Dashboard choose  New > Blueprint,  point it at this repository and
# Render reads the settings below instead of you filling in every field by hand.
#
# WHY THERE IS NO DISK AND WHY THE PLAN IS FREE
# This service keeps everything it needs in a Turso database (TURSO_DATABASE_URL) —
# the invitations, the audit log, the uploaded documents and the signature images,
# the last two as BLOB columns. Render's free instance has an EPHEMERAL filesystem
# that it wipes on every deploy and restart, but there is nothing on it to lose.
# The data itself is safe at Turso, which has its own free tier (5 GB, no card).
#
# Before the first deploy, create that database and copy its two values:
#   1. Install the CLI:  npm i -g @tursodatabase/cli
#   2. turso auth signup
#   3. turso db create khusela
#   4. turso db show khusela --url       -> libsql://khusela-<you>.turso.io
#   5. turso db tokens create khusela    -> the auth token
# Enter both in the service's Environment tab (Render prompts for the two
# "sync: false" variables below rather than storing them in this repository).
services:
  - type: web
    name: khusela-signature-backend
    runtime: node
    # Frankfurt is the closest Render region to South Africa (frankfurt, oregon,
    # ohio, virginia, singapore).
    region: frankfurt
    # The free instance sleeps after about 15 minutes idle and takes up to a minute
    # to wake, so the first page load after a quiet spell is slow. That delay is the
    # whole cost of the free plan; the data itself is unaffected while it sleeps.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    # /health answers 200 once the server is up, so Render only shifts traffic over
    # after the database has opened.
    healthCheckPath: /health
    envVars:
      # The database lives at Turso. Both values are secrets: keep them in the
      # dashboard, never in this file.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # PUBLIC_BASE_URL is deliberately NOT set: Render publishes the service's own
      # URL as RENDER_EXTERNAL_URL and the server uses that, so signing links point
      # at https://<service-name>.onrender.com straight away. Set PUBLIC_BASE_URL
      # here only if you attach a custom domain.
      # Only this exact origin may call the API (no trailing slash, https required).
      # Add your own PWA address here if it is not this one.
      - key: ALLOWED_ORIGINS
        value: https://itc-extractor.vercel.app
      # A signing link is completed with a signature alone.
      - key: REQUIRE_DOCUMENTS
        value: "false"
      - key: TOKEN_EXPIRY_DAYS
        value: "7"
      - key: MAX_UPLOAD_MB
        value: "15"
      # Render generates a strong secret. Read it under the service's Environment
      # tab if you ever need to call the /api/admin/* endpoints.
      - key: ADMIN_API_KEY
        generateValue: true
