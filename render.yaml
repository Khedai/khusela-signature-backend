# Render Blueprint for the Khusela signature backend.
#
# In the Render Dashboard choose  New > Blueprint,  point it at this repository and
# Render reads the settings below instead of you filling in every field by hand.
#
# WHY THERE IS NO DISK AND WHY THE PLAN IS FREE
# This service keeps everything it needs in a Turso database (TURSO_DATABASE_URL) —
# the invitations, the audit log, the uploaded documents and the signature images,
# the last two as BLOB columns. Render's free instance has an EPHEMERAL filesystem
# that it wipes on every deploy and restart, but there is nothing on it to lose.
# The data itself is safe at Turso, which has its own free tier (5 GB, no card).
#
# Before the first deploy, create that database and copy its two values. There is
# NO npm package for this CLI: `npm i -g @tursodatabase/cli` fails with a 404. The
# Turso CLI runs on Linux and macOS only, so on Windows install it inside WSL:
#   Windows  : run `wsl`, then the Linux line below
#   macOS    : brew install tursodatabase/tap/turso
#   Linux/WSL: curl -sSfL https://get.tur.so/install.sh | bash
#   1. turso auth login --headless   (--headless prints a URL to open: WSL has no
#      browser, and the same flag is what CI/CD environments need)
#   2. turso db create khusela
#   3. turso db show khusela --url       -> libsql://khusela-<you>.turso.io
#   4. turso db tokens create khusela    -> the auth token
# Installing nothing at all also works: the Turso dashboard creates the database
# and a token for it by clicking.
# Enter both in the service's Environment tab (Render prompts for the two
# "sync: false" variables below rather than storing them in this repository).
services:
  - type: web
    name: khusela-signature-backend
    runtime: node
    # Frankfurt is the closest Render region to South Africa (frankfurt, oregon,
    # ohio, virginia, singapore).
    region: frankfurt
    # The free instance sleeps after about 15 minutes idle and takes up to a minute
    # to wake, so the first page load after a quiet spell is slow. That delay is the
    # whole cost of the free plan; the data itself is unaffected while it sleeps.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    # /health answers 200 once the server is up, so Render only shifts traffic over
    # after the database has opened.
    healthCheckPath: /health
    envVars:
      # The database lives at Turso. Both values are secrets: keep them in the
      # dashboard, never in this file.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # PUBLIC_BASE_URL is deliberately NOT set: Render publishes the service's own
      # URL as RENDER_EXTERNAL_URL and the server uses that, so signing links point
      # at https://<service-name>.onrender.com straight away. Set PUBLIC_BASE_URL
      # here only if you attach a custom domain.
      # Only this exact origin may call the API (no trailing slash, https required).
      # Add your own PWA address here if it is not this one.
      - key: ALLOWED_ORIGINS
        value: https://itc-extractor.vercel.app
      # A signing link is completed with a signature alone.
      - key: REQUIRE_DOCUMENTS
        value: "false"
      - key: TOKEN_EXPIRY_DAYS
        value: "7"
      - key: MAX_UPLOAD_MB
        value: "15"
      # Minting a signing link is the one action with no token to check (the PWA
      # calls it from a browser). INVITE_API_KEY is deliberately NOT set here: the
      # PWA has to send it first or its "Send Signing Link" button stops working.
      # Until it is set, /health reports inviteProtected:false and the route
      # accepts only callers with an allowed Origin (the PWA) or a local one, on top
      # of INVITE_RATE_LIMIT (20 per address per 10 minutes).
      #
      # TRUST_PROXY_HOPS is how many proxies append to X-Forwarded-For before this
      # process sees the request, and it has to be the real number. Too few and the
      # recorded IP is an address inside Render (a signature from a real phone named
      # "::1" before this existed); too many and a caller could name itself.
      # Measured on 2026-09-29 from real signing requests, the chain was
      #   165.0.11.224, 172.68.247.29, 10.24.207.248
      # the client, Render's edge and Render's internal hop, so three appends.
      # Only the number matters: the last entry differs from request to request
      # (10.29.92.62 and 10.29.109.133 on two other attempts). The server keeps the
      # whole chain in the audit entry (meta.xff), so a recorded address can be
      # checked rather than trusted.
      #
      # The code works this out by itself: it uses 3 when RENDER_SERVICE_ID is set,
      # and 1 anywhere else. This value only takes effect on a Blueprint sync, and
      # Render does not push blueprint env changes into a service that already exists,
      # so the code default is what governs a service created before this line was
      # added. Re-measure with the live harness if Render's edge changes.
      - key: TRUST_PROXY_HOPS
        value: "3"
      # Render generates a strong secret. Read it under the service's Environment
      # tab if you ever need to call the /api/admin/* endpoints.
      - key: ADMIN_API_KEY
        generateValue: true
      # ── Emailing the finished application ──────────────────────────────────
      # POST /api/email mails the PDF the PWA renders to MAIL_TO, from this
      # service's own mailbox, instead of the PWA handing it to a third-party
      # form-to-email service (see mailer.js for why that had to stop).
      #
      # IMPORTANT: Render applies these to a service it creates from this
      # blueprint. It does NOT push a blueprint change into a service that already
      # exists — an existing service needs the same keys added by hand in
      # Dashboard > Environment. The server says which state it is in:
      # /health reports emailConfigured:true once MAIL_TO, SMTP_USER and SMTP_PASS
      # are all set.
      - key: MAIL_TO
        value: khuselamanagement@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: khuselamanagement@gmail.com
      # The Gmail APP PASSWORD (16 characters, no spaces), not the account
      # password: Google refuses the account password for SMTP and only offers an
      # app password once 2-step verification is on. Render prompts for this one
      # rather than storing it in this repository.
      - key: SMTP_PASS
        sync: false
      # MAIL_TO is the only address this service will ever send to: the app cannot
      # name a recipient, so a copied URL cannot be used to mail strangers. The
      # sender is left at its default (the authenticated account).
      - key: MAX_EMAIL_MB
        value: "20"
